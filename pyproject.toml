[project]
name = "outbound-orchestrator"
version = "0.1.0"
description = "Route qualified leads to email (Instantly) and LinkedIn (HeyReach) in one pass."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
